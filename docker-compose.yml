services:
  wine-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: wine-classification-api:latest
    container_name: wine_classification_api
    init: true
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request, sys; res = urllib.request.urlopen('http://127.0.0.1:8000/health'); sys.exit(0 if res.getcode() == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  wine-ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    image: wine-classification-ui:latest
    container_name: wine_classification_ui
    init: true
    ports:
      - "127.0.0.1:${UI_PORT:-8501}:8501"
    environment:
      - API_BASE_URL=http://wine-api:8000
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    depends_on:
      wine-api:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request, sys; res = urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health'); sys.exit(0 if res.getcode() == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
