services:
  wine-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: wine-classification-api:latest
    container_name: wine_classification_api
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
    restart: unless-stopped
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request, sys; res = urllib.request.urlopen('http://127.0.0.1:8000/health'); sys.exit(0 if res.getcode() == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  wine-ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    image: wine-classification-ui:latest
    container_name: wine_classification_ui
    ports:
      - "${UI_PORT:-8501}:8501"
    environment:
      - API_BASE_URL=http://wine-api:8000
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
    restart: unless-stopped
    depends_on:
      wine-api:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request, sys; res = urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health'); sys.exit(0 if res.getcode() == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
