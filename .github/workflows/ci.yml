name: CI Pipeline

"on":
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    name: Lint, Test & Docker Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Upgrade pip & install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt -r requirements-ui.txt

      - name: Verify dependency consistency
        run: |
          python -m pip check

      - name: Run Ruff linter & static analysis
        run: |
          ruff check .

      - name: Execute automated test suite with coverage
        run: |
          pytest -v --cov=src --cov-report=term-missing

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose configuration
        run: |
          docker compose config --quiet

      - name: Build API Docker image
        run: |
          docker build \
            --tag wine-api:${{ github.sha }} \
            --tag wine-api:ci-test \
            --file Dockerfile \
            .

      - name: Verify API image dependency isolation
        run: |
          docker run --rm wine-api:ci-test python -c "import sys; pkgs = ['pytest', 'pytest_cov', 'ruff', 'httpx']; found = [p for p in pkgs if __import__('importlib.util').util.find_spec(p)]; print(f'ERROR: Unwanted packages in API image: {found}') if found else print('OK: Dev and test packages absent from API image'); sys.exit(1 if found else 0)"

      - name: Build Streamlit UI Docker image
        run: |
          docker build \
            --tag wine-ui:${{ github.sha }} \
            --tag wine-ui:ci-test \
            --file Dockerfile.ui \
            .

      - name: Verify UI image dependency isolation
        run: |
          docker run --rm wine-ui:ci-test python -c "import sys; pkgs = ['sklearn', 'joblib']; found = [p for p in pkgs if __import__('importlib.util').util.find_spec(p)]; print(f'ERROR: ML packages in UI image: {found}') if found else print('OK: ML packages absent from UI image'); sys.exit(1 if found else 0)"
